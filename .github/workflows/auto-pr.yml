name: Auto Create PR
on:
  push:
    branches-ignore:
      - main
      - develop
permissions:
  contents: write
  pull-requests: write
jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if PR already exists
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh pr list --head ${{ github.ref_name }} --state open --json number --jq 'length')
          echo "exists=$COUNT" >> $GITHUB_OUTPUT
      - name: Set up Python
        if: steps.check_pr.outputs.exists == '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.check_pr.outputs.exists == '0'
        run: pip install google-genai
      - name: Fetch Repository Labels
        if: steps.check_pr.outputs.exists == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label list --json name --jq '.[].name' > labels.txt
      - name: Generate PR Data
        if: steps.check_pr.outputs.exists == '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git log origin/main..HEAD --pretty=format:"%s%n%b" > commits.txt
          git diff origin/main..HEAD > diff.txt
          python .github/scripts/generate_pr_info.py > pr_info.json
      - name: Create Pull Request
        if: steps.check_pr.outputs.exists == '0'
        env:
          MINGYU_PAT: ${{ secrets.MINGYU_PERSONAL_TOKEN }}
          SUJI_PAT: ${{ secrets.SUJI_PERSONAL_TOKEN }}
          SONGJUNE_PAT: ${{ secrets.SONGJUNE_PERSONAL_TOKEN }}
          BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if jq -e 'type=="object" or type=="array"' pr_info.json >/dev/null 2>&1; then
            PR_OBJ=$(jq 'if type=="array" then .[0] else . end' pr_info.json)
            TITLE=$(echo "$PR_OBJ" | jq -r '.title')
            AI_LABELS=$(echo "$PR_OBJ" | jq -r '.labels | join(",")')
            echo "$PR_OBJ" | jq -r '.body' > pr_body.md
          else
            echo "::warning::pr_info.json 파싱 실패 - 커밋 메시지로 대체합니다"
            cat pr_info.json || true
            TITLE=$(git log -1 --pretty=%s)
            AI_LABELS=""
            git log origin/main..HEAD --pretty=format:'- %s' > pr_body.md
          fi

          case "${{ github.actor }}" in
            "Mingyu0626")
              USER_LABEL="🍎최민규"
              SELECT_TOKEN=$MINGYU_PAT
              ;;
            "sooji123")
              USER_LABEL="🍪박수지"
              SELECT_TOKEN=$SUJI_PAT
              ;;
            "helloSalmon")
              USER_LABEL="🍯송준"
              SELECT_TOKEN=$SONGJUNE_PAT
              ;;
            *)
              USER_LABEL="${{ github.actor }}"
              SELECT_TOKEN=$BOT_TOKEN
              ;;
          esac
          
          if [ -z "$SELECT_TOKEN" ]; then
            SELECT_TOKEN=$BOT_TOKEN
          fi
          
          if [ -z "$AI_LABELS" ]; then
            ALL_LABELS="$USER_LABEL"
          else
            ALL_LABELS="$AI_LABELS,$USER_LABEL"
          fi
          
          PR_URL=$(GH_TOKEN=$SELECT_TOKEN gh pr create \
            --base main \
            --head ${{ github.ref_name }} \
            --title "$TITLE" \
            --body-file pr_body.md \
            --draft)
          echo "$PR_URL"
          PR_NUMBER=$(basename "$PR_URL")

          # gh pr create에 라벨과 담당자를 함께 넘기면 PR을 만든 직후 GraphQL 수정 요청을 한 번 더 보내는데,
          # 이 요청이 GitHub 내부 오류로 간헐적으로 실패해 담당자가 빠지고 잡이 실패했다(#142, #143, #147, #150, #151).
          # 생성과 분리해 잠시 기다린 뒤 REST API로 붙이고, 실패하면 다시 시도한다.
          LABEL_ARGS=()
          IFS=',' read -ra LABELS <<< "$ALL_LABELS"
          for LABEL in "${LABELS[@]}"; do
            # 등록되지 않은 사용자는 아이디가 라벨로 들어오므로 저장소에 있는 라벨만 추린다.
            if grep -Fxq "$LABEL" labels.txt; then
              LABEL_ARGS+=(-f "labels[]=$LABEL")
            fi
          done

          apply_metadata() {
            if [ ${#LABEL_ARGS[@]} -gt 0 ]; then
              GH_TOKEN=$SELECT_TOKEN gh api --method POST "repos/${{ github.repository }}/issues/$PR_NUMBER/labels" "${LABEL_ARGS[@]}" > /dev/null || return 1
            fi
            GH_TOKEN=$SELECT_TOKEN gh api --method POST "repos/${{ github.repository }}/issues/$PR_NUMBER/assignees" -f "assignees[]=${{ github.actor }}" > /dev/null
          }

          for ATTEMPT in 1 2 3; do
            sleep $((ATTEMPT * 3))
            if apply_metadata; then
              exit 0
            fi
            echo "::warning::라벨·담당자 지정 실패(${ATTEMPT}/3), 다시 시도합니다"
          done
          echo "::error::PR은 만들어졌지만 라벨·담당자를 붙이지 못했습니다. 직접 지정해 주세요: $PR_URL"
          exit 1
